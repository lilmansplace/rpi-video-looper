# rpi-video-looper settings
# This file lives on the SD card's boot partition (/boot/firmware/looper.toml),
# so you can edit it from any computer. You can also put a looper.toml next to
# your videos on the thumb drive: settings there win over this file.
# Changes made in the web UI or Home Assistant are saved on the Pi and win over
# playback settings below. Restart the looper (or reboot) after editing.

# ---- Getting online -------------------------------------------------------
# Easiest: just boot it. With no network, the projector shows a QR code for a
# setup hotspot. Or fill this in and the looper joins on boot (the password is
# removed from this file once it's saved on the Pi).
[wifi]
ssid = ""
password = ""
country = "US"                  # two-letter code; needed for Wi-Fi to work
hidden = false

[device]
name = "Video Looper"           # shown in Home Assistant and used as the hostname

# Remote login for user "looper". Off unless you set a password here.
# [ssh]
# enabled = true
# password = "choose-something"

[media]
dir = "/media/usb"              # the thumb drive is mounted here automatically
device = "/dev/sda1"            # set to "" if your videos are on the SD card instead
extensions = ["mp4", "m4v", "mkv", "mov", "avi", "h264", "ts"]
rescan_interval = 30            # seconds between checks for new/removed files (0 = off)
recursive = true

[playback]
shuffle = true
repeat = "all"                  # all | one | off
volume = 100
resume_on_boot = false          # true = start with the last video that was playing
skip_incompatible = false       # true = skip videos found to be too heavy for the Pi (4K, HEVC, 60fps...)

[player]
# Pi Zero W decodes H.264 in hardware (up to 1080p30). HEVC/H.265 and VP9 are
# NOT hardware-decoded on a Zero and will stutter.
# These defaults were measured on a Pi Zero W: 1080p30 plays in real time at ~58% CPU.
# Run tools/bench.py to compare settings with your own files.
vo = "gpu"
gpu_context = "drm"
hwdec = "v4l2m2m"               # zero-copy hardware decode
profile = "fast"                # lighter scaling; "" = mpv's default (too heavy for a Zero)
display_mode = "1280x720"       # HDMI output; "" = the projector's preferred mode
audio_output = "alsa"
extra_args = []

[snapshot]
interval = 30                   # seconds between snapshots (0 = off)
width = 480
quality = 70
method = "auto"                 # "file" (ffmpeg, background) | "player" (mpv) | "auto"

[status]
position_interval = 10          # how often the playback position is published

[mqtt]
# "auto" = find Home Assistant / Mosquitto on the network by itself.
# true = use host below only. false = off.
enabled = "auto"
host = "homeassistant.local"
port = 1883
username = ""
password = ""
discovery_prefix = "homeassistant"
node_id = ""                    # default: from [device] name
name = ""                       # default: [device] name

[web]
enabled = true
bind = "0.0.0.0"
port = 8080
