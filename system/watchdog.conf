[Manager]
# Hardware watchdog: reboots the Pi if systemd stops responding.
# OFF by default: on a Pi Zero W, a busy CPU while a video starts can miss the
# ~15 s hardware limit and cause a reboot loop. Turn on once playback is proven stable:
#   RuntimeWatchdogSec=14
#   RebootWatchdogSec=2min
RuntimeWatchdogSec=0
